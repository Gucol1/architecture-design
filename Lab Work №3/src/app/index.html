<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Авторизация</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Авторизация</h2>

    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Пароль"><br><br>
    <button style="background-color : red; color: white; font-size: 25px" onclick="login()">Большая красная кнопка </button>

    <p id="result"></p>

    <script>
        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch("http://localhost:8000/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const result = document.getElementById("result");

            if (response.ok) {
                const data = await response.json();
                result.innerText = "Token: " + data.access_token;
            } else {
                result.innerText = "Неверный email или пароль";
            }
        }
    </script>
</body>
</html>
