name: CI

on:
  pull_request:
  push:
    branches: ["LabWork5"]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services
        run: docker compose build

      - name: Start db + backend
        run: docker compose up -d db backend

      - name: Run integration tests
        run: docker compose run --rm -e BASE_URL=http://backend:8000 backend pytest -q

      - name: Shutdown
        if: always()
        run: docker compose down -v


      - name: Build & Push images to GHCR
        if: github.ref == 'refs/heads/LabWork5'
        run: |
          IMAGE_PREFIX=ghcr.io/${{ github.repository_owner }}
          docker build -t $IMAGE_PREFIX/app-backend:latest ./backend
          docker build -t $IMAGE_PREFIX/app-frontend:latest ./frontend
          docker push $IMAGE_PREFIX/app-backend:latest
          docker push $IMAGE_PREFIX/app-frontend:latest